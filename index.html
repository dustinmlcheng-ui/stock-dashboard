  --accent: #4f46e5; --head: #0b1220; --head-text: #e2e8f0;

}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b1020; --panel: #121a2e; --text: #e5e7eb; --muted: #94a3b8; --line: #23304a;
    --up: #34d399; --up-bg: rgba(52,211,153,.12); --down: #f87171; --down-bg: rgba(248,113,113,.12);
    --accent: #818cf8; --head: #060a16; --shadow: none; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.example-banner { background: repeating-linear-gradient(-45deg, #fde68a 0 14px, #fcd34d 14px 28px);
  color: #451a03; text-align: center; font-weight: 700; padding: 10px 16px; font-size: 15px;
  border-bottom: 2px solid #b45309; position: sticky; top: 0; z-index: 10; }
.example-banner small { display: block; font-weight: 500; font-size: 12.5px; }

.site-header { background: linear-gradient(135deg, #0b1220 0%, #1e1b4b 100%); color: var(--head-text);
  padding: 28px 0 24px; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; color: #a5b4fc; font-weight: 600; }
h1 { margin: 6px 0 8px; font-size: 28px; line-height: 1.2; color: #fff; }
h1 .session { display: inline-block; font-size: 15px; font-weight: 600; color: #c7d2fe;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
  padding: 3px 10px; border-radius: 999px; vertical-align: middle; margin-left: 6px; }
.context { margin: 0; font-size: 16px; max-width: 900px; color: #cbd5e1; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.stat { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px; padding: 6px 12px; font-size: 13px; color: #cbd5e1; }
.stat b { color: #fff; font-size: 15px; margin-right: 4px; }
.stat .up { color: #6ee7b7; } .stat .down { color: #fca5a5; }

section { margin-top: 28px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex-wrap: wrap; margin-bottom: 12px; }
h2 { margin: 0; font-size: 20px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px 18px; border-top: 4px solid var(--line);
  display: flex; flex-direction: column; min-width: 0; }
.card.up { border-top-color: var(--up); } .card.down { border-top-color: var(--down); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card .tk { font-size: 20px; font-weight: 800; letter-spacing: .01em; }
.card .nm { color: var(--muted); font-size: 13px; }
.pill { font-weight: 700; font-size: 16px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.up { color: var(--up); background: var(--up-bg); } .pill.down { color: var(--down); background: var(--down-bg); }
.card .px { font-size: 13px; color: var(--muted); margin-top: 6px; }
.card .reason { margin: 12px 0 0; font-size: 14.5px; overflow-wrap: anywhere; }
.card .sources { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px dashed var(--line);
  font-size: 13.5px; display: grid; gap: 6px; }
.card .sources li { overflow-wrap: anywhere; }
.card .sources .outlet { font-weight: 700; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius);
  padding: 20px; color: var(--muted); }

#filter { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel); color: var(--text); width: 240px; max-width: 100%; }
.table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th { position: sticky; top: 0; background: var(--panel); font-size: 12px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--muted); cursor: pointer; user-select: none; }
th:hover { color: var(--text); }
th::after { content: "↕"; opacity: .35; margin-left: 5px; font-size: 11px; }
th[aria-sort="ascending"]::after { content: "▲"; opacity: 1; color: var(--accent); }
th[aria-sort="descending"]::after { content: "▼"; opacity: 1; color: var(--accent); }
th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--text); }
.r { text-align: right; }
td.tk { font-weight: 700; }
td.col-name { max-width: 340px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
td.up { color: var(--up); font-weight: 600; } td.down { color: var(--down); font-weight: 600; }
tbody tr:hover td { background: rgba(79,70,229,.04); }
tr.is-mover td.tk::after { content: "●"; color: var(--accent); font-size: 9px; vertical-align: super; margin-left: 4px; }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; }
th:first-child { z-index: 2; }
.hint { font-size: 12.5px; margin: 8px 2px 0; }
footer { margin: 36px auto 40px; font-size: 12.5px; }
footer p { margin: 4px 0; overflow-wrap: anywhere; }

@media (max-width: 640px) {
  body { font-size: 14px; }
  .wrap { padding: 0 14px; }
  .site-header { padding: 20px 0 18px; }
  h1 { font-size: 22px; }
  h1 .session { display: block; width: fit-content; margin: 8px 0 0; font-size: 13px; }
  .context { font-size: 14.5px; }
  .cards { grid-template-columns: 1fr; gap: 12px; }
  #filter { width: 100%; }
  th, td { padding: 9px 6px; font-size: 13px; }
  th { font-size: 10.5px; letter-spacing: .03em; white-space: normal; line-height: 1.25; vertical-align: bottom; }
  th::after { margin-left: 2px; }
  th:first-child, td:first-child { padding-left: 10px; }
  th:last-child, td:last-child { padding-right: 10px; }
  table { min-width: 0; }
  .col-name { display: none; }
  td:first-child { box-shadow: 1px 0 0 var(--line); }
}

</style>

</main>

<script>
(function () {
  "use strict";
  var D = window.DASHBOARD_DATA || { stocks: [] };
  var stocks = (D.stocks || []).slice();

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function fmtPrice(v) {
    return isNum(v) ? "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
  }
  function fmtPct(v) {
    if (!isNum(v)) return "—";
    var s = Math.abs(v).toFixed(2) + "%";
    return (v > 0 ? "+" : v < 0 ? "−" : "") + s;
  }
  function fmtCap(v) {
    if (!isNum(v)) return "—";
    var a = Math.abs(v), u = [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]];
    for (var i = 0; i < u.length; i++) {
      if (a >= u[i][0]) return "$" + (v / u[i][0]).toFixed(2) + u[i][1];
    }
    return "$" + v.toFixed(0);
  }
  function dir(v) { return !isNum(v) || v === 0 ? "" : v > 0 ? "up" : "down"; }
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!m) return s || "";
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return d.toLocaleDateString("en-US", { weekday: "short", year: "numeric", month: "short", day: "numeric", timeZone: "UTC" });
  }
  function fmtStamp(s) {
    var d = new Date(s);
    if (!s || isNaN(d)) return s || "";
    try {
      return d.toLocaleString("en-GB", { timeZone: "Asia/Hong_Kong", day: "numeric", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit", hour12: false }) + " HKT";
    } catch (e) { return s; }
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }

  // ---- example banner
  if (D.is_example) {
    var b = el("div", "example-banner", "⚠ Example data — not real prices");
    b.setAttribute("role", "alert");
    b.appendChild(el("small", null, "Prices, moves, reasons and sources are invented for layout preview. Real Stock Watcher results will replace this automatically on rebuild."));
    $("banner-slot").appendChild(b);
  }

  // ---- header
  $("session-date").textContent = D.session_date ? "Session " + fmtDate(D.session_date) : "Session date unavailable";
  $("market-context").textContent = D.market_context || "No market context provided.";

  var withPct = stocks.filter(function (s) { return isNum(s.pct_change); });
  var up = withPct.filter(function (s) { return s.pct_change > 0; }).length;
  var down = withPct.filter(function (s) { return s.pct_change < 0; }).length;
  var movers = stocks.filter(function (s) { return s.mover; })
    .sort(function (a, b) { return Math.abs(b.pct_change || 0) - Math.abs(a.pct_change || 0); });
  var stats = $("stats");
  function stat(n, label, cls) {
    var s = el("div", "stat"); var bb = el("b", cls || null, String(n));
    s.appendChild(bb); s.appendChild(document.createTextNode(label)); stats.appendChild(s);
  }
  stat(stocks.length, "stocks");
  stat(up, "up", "up");
  stat(down, "down", "down");
  stat(movers.length, "movers");
  if (withPct.length) {
    var best = withPct.reduce(function (a, b) { return b.pct_change > a.pct_change ? b : a; });
    var worst = withPct.reduce(function (a, b) { return b.pct_change < a.pct_change ? b : a; });
    stat(best.ticker, " best " + fmtPct(best.pct_change), "up");
    stat(worst.ticker, " worst " + fmtPct(worst.pct_change), "down");
  }

  // ---- movers
  var thr = D.mover_threshold || 3;
  $("movers-sub").textContent = movers.length ? movers.length + " flagged (moves ≥ " + thr + "%)" : "";
  var box = $("movers");
  if (!movers.length) {
    box.appendChild(el("div", "empty", "No movers flagged this session."));
  }
  movers.forEach(function (s) {
    var d = dir(s.pct_change);
    var c = el("article", "card " + d);
    var top = el("div", "card-top");
    var left = el("div");
    left.appendChild(el("div", "tk", s.ticker));
    left.appendChild(el("div", "nm", s.name || ""));
    top.appendChild(left);
    top.appendChild(el("span", "pill num " + d, fmtPct(s.pct_change)));
    c.appendChild(top);
    var px = [];
    if (isNum(s.close)) px.push("Close " + fmtPrice(s.close));
    if (isNum(s.prev_close)) px.push("prev " + fmtPrice(s.prev_close));
    if (isNum(s.market_cap)) px.push("cap " + fmtCap(s.market_cap));
    if (px.length) c.appendChild(el("div", "px num", px.join(" · ")));
    c.appendChild(el("p", "reason" + (s.reason ? "" : " muted"), s.reason || "No reason text provided."));
    if (s.sources && s.sources.length) {
      var ul = el("ul", "sources");
      s.sources.forEach(function (src) {
        var li = el("li");
        li.appendChild(el("span", "outlet", (src.outlet || "Source") + ": "));
        var url = safeUrl(src.url), t = src.title || src.url || "(untitled)";
        if (url) {
          var a = el("a", null, t);
          a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
          li.appendChild(a);
        } else {
          li.appendChild(document.createTextNode(t));
        }
        ul.appendChild(li);
      });
      c.appendChild(ul);
    }
    box.appendChild(c);
  });

  // ---- table
  var tbody = document.querySelector("#tbl tbody");
  var ths = document.querySelectorAll("#tbl th");
  var sortKey = "market_cap", sortDir = -1, query = "";

  function render() {
    var col = document.querySelector('#tbl th[data-key="' + sortKey + '"]');
    var type = col ? col.getAttribute("data-type") : "num";
    var rows = stocks.filter(function (s) {
      if (!query) return true;
      return (s.ticker + " " + (s.name || "")).toLowerCase().indexOf(query) !== -1;
    });
    rows.sort(function (a, b) {
      var x = a[sortKey], y = b[sortKey];
      var xm = type === "num" ? !isNum(x) : !x, ym = type === "num" ? !isNum(y) : !y;
      if (xm || ym) return xm === ym ? 0 : xm ? 1 : -1;  // blanks always last
      var r = type === "num" ? x - y : String(x).localeCompare(String(y));
      return r * sortDir || a.ticker.localeCompare(b.ticker);
    });
    tbody.textContent = "";
    rows.forEach(function (s) {
      var tr = el("tr", s.mover ? "is-mover" : "");
      var tdT = el("td", "tk", s.ticker);
      tdT.title = s.name || "";
      tr.appendChild(tdT);
      var tdN = el("td", "col-name", s.name || ""); tdN.title = s.name || ""; tr.appendChild(tdN);
      tr.appendChild(el("td", "r num", fmtPrice(s.close)));
      tr.appendChild(el("td", "r num", fmtPrice(s.prev_close)));
      tr.appendChild(el("td", "r num " + dir(s.pct_change), fmtPct(s.pct_change)));
      tr.appendChild(el("td", "r num", fmtCap(s.market_cap)));
      tbody.appendChild(tr);
    });
    if (!rows.length) {
      var tr0 = el("tr"), td0 = el("td", "muted", "No matches.");
      td0.colSpan = 6; tr0.appendChild(td0); tbody.appendChild(tr0);
    }
    ths.forEach(function (th) {
      th.setAttribute("aria-sort", th.getAttribute("data-key") === sortKey ? (sortDir > 0 ? "ascending" : "descending") : "none");
    });
  }
  ths.forEach(function (th) {
    th.tabIndex = 0;
    function go() {
      var k = th.getAttribute("data-key");
      if (k === sortKey) sortDir = -sortDir;
      else { sortKey = k; sortDir = th.getAttribute("data-type") === "str" ? 1 : -1; }
      render();
    }
    th.addEventListener("click", go);
    th.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  $("filter").addEventListener("input", function (e) { query = e.target.value.trim().toLowerCase(); render(); });
  render();

  // ---- footer
  var f = $("footer");
  f.appendChild(el("p", null, (D.is_example ? "EXAMPLE DATA. " : "") + "Source: " + (D.source || "unknown") +
    (D.generated_at ? " · digest generated " + fmtStamp(D.generated_at) : "")));
  (D.notes || []).forEach(function (n) { f.appendChild(el("p", null, "Note: " + n)); });
  f.appendChild(el("p", null, "Not investment advice. Rebuilt from Stock Watcher output (python3 build.py). Hosted on GitHub Pages."));
})();
